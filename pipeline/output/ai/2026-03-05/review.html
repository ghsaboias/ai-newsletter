      "headline": "NEJM publishes first evidence of disease modification in Dravet syndrome with Stoke/Biogen's zorevunersen",
      "key_facts": [
        "Results from Phase 1/2a and open-label extension studies of zorevunersen were published in the New England Journal of Medicine on March 5",
        "The studies demonstrate for the first time the potential for disease modification in Dravet syndrome, a severe genetic neurodevelopmental disease",
        "Patients receiving 70mg doses showed motor seizure reduction of nearly 85% at three months and 73% at six months",
        "Extension study patients experienced seizure reduction ranging from 58% to 90% over 20 months",
        "Treatment showed improvements in communication, motor skills, socialization, daily living, and quality of life beyond just seizure control",
        "Zorevunersen is an antisense oligonucleotide designed to increase functional NaV1.1 protein production from the unaffected SCN1A gene",
        "Developed by Stoke Therapeutics (Nasdaq: STOK) and Biogen (Nasdaq: BIIB); a global Phase 3 EMPEROR study is enrolling approximately 150 patients"

      "url": "https://in.mobile.reuters.com/world/asia-pacific/china-vows-accelerate-technological-self-reliance-ai-push-2026-03-05/",
      "anchor_text": "15º Plano Quinquenal com IA como espinha dorsal",
      "claim": "a China lançou seu 15º Plano Quinquenal com IA como espinha dorsal — cobrindo manufatura, transporte e serviços",
      "flags": [
        {
          "type": "source_unavailable",
          "severity": "warning",
          "detail": "Reuters returned 'Please enable JS and disable any ad blocker'. The specific framing of AI as the plan's 'backbone' covering manufacturing, transport and services cannot be verified. The China Academy source partially supports this but uses different language."
        }
      ]
    }
  ],
  "date": "2026-03-05",
  "window": "2026-03-04 10:00 → 2026-03-05 10:00 BRT",
  "urls_audited": 37,
  "urls_flagged": 19
};
const DATA_REWRITE  = null;
const DATA_REVIEWED = [];
const REVIEWED_PATH = '/Users/guilherme/ai-newsletter/pipeline/output/2026-03-05/audit-reviewed.json';

// --- Normalize key_facts: handle both string[] and {fact, source_url}[] ---
DATA_RESEARCH.stories.forEach(story => {
  story.key_facts = (story.key_facts || []).map(f =>
    typeof f === 'string' ? { fact: f } : f
  );
});

// --- Build URL → story index for cross-linking ---
const urlToStoryIdx = {};
DATA_RESEARCH.stories.forEach((story, idx) => {
  (story.sources || []).forEach(s => { urlToStoryIdx[s.url] = idx; });
  story.key_facts.forEach(f => { if (f.source_url) urlToStoryIdx[f.source_url] = idx; });
});

// --- Build URL → audit flags ---
const urlToAudit = {};
if (DATA_AUDIT && DATA_AUDIT.issues) {
  DATA_AUDIT.issues.forEach(issue => {
    urlToAudit[issue.url] = issue;
  });
}

// --- Reviewed state (localStorage + file) ---
const REVIEW_KEY = 'audit-reviewed-2026-03-05';
// Merge file-persisted reviewed URLs with localStorage
const fileReviewed = Array.isArray(DATA_REVIEWED) ? DATA_REVIEWED : [];
const localReviewed = JSON.parse(localStorage.getItem(REVIEW_KEY) || '[]');
let reviewedUrls = new Set([...fileReviewed, ...localReviewed]);
let dirty = false; // true when reviewed state differs from saved file

function saveReviewed() {
  localStorage.setItem(REVIEW_KEY, JSON.stringify([...reviewedUrls]));
  // Check if state differs from what was loaded from file
  const current = [...reviewedUrls].sort();
  const fromFile = [...fileReviewed].sort();
  dirty = JSON.stringify(current) !== JSON.stringify(fromFile);
  updateSaveBtn();
}

function toggleReviewed(url) {
  if (reviewedUrls.has(url)) {
    reviewedUrls.delete(url);
  } else {
    reviewedUrls.add(url);
  }
  saveReviewed();
  applyReviewedState();
  updateStats();
}

function applyReviewedState() {
  document.querySelectorAll('.article-content a[data-audit-url]').forEach(a => {
    const url = a.dataset.auditUrl;
    a.classList.toggle('audit-reviewed', reviewedUrls.has(url));
  });
  document.querySelectorAll('.audit-item[data-url]').forEach(item => {
    item.classList.toggle('reviewed', reviewedUrls.has(item.dataset.url));
  });
}

// --- Save button ---
const saveBtn = document.getElementById('save-btn');

function updateSaveBtn() {
  saveBtn.style.display = dirty ? 'inline-block' : 'none';
}

saveBtn.addEventListener('click', () => {
  const data = JSON.stringify([...reviewedUrls].sort(), null, 2);
  const blob = new Blob([data + '\n'], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'audit-reviewed.json';
  a.click();
  URL.revokeObjectURL(a.href);
  // Also copy a move command to clipboard for convenience
  const cmd = 'mv ~/Downloads/audit-reviewed.json ' + REVIEWED_PATH;
  navigator.clipboard.writeText(cmd).then(() => {
    saveBtn.textContent = 'Saved! (mv command copied)';
    dirty = false;
    setTimeout(() => { saveBtn.textContent = 'Save'; updateSaveBtn(); }, 3000);
  }).catch(() => {
    saveBtn.textContent = 'Downloaded!';
    dirty = false;
    setTimeout(() => { saveBtn.textContent = 'Save'; updateSaveBtn(); }, 3000);
  });
});

// --- Stats ---
const storyCount = DATA_RESEARCH.stories.length;
const sourceCount = DATA_RESEARCH.stories.reduce((n, s) => n + (s.sources || []).length, 0);
const flagCount = DATA_AUDIT ? (DATA_AUDIT.issues || []).length : 0;

function updateStats() {
  const reviewed = reviewedUrls.size;
  const open = flagCount - reviewed;
  document.getElementById('stat-stories').innerHTML = '<b>' + storyCount + '</b> stories';
  document.getElementById('stat-sources').innerHTML = '<b>' + sourceCount + '</b> sources';
  document.getElementById('stat-flags').innerHTML = '<b>' + open + '</b> flags' + (reviewed ? ' <span style="color:#666">(' + reviewed + ' reviewed)</span>' : '');
}
updateStats();

// --- Research cards ---
function renderResearchCards() {
  const container = document.getElementById('research-cards');
  DATA_RESEARCH.stories.forEach((story, idx) => {
    const card = document.createElement('div');
    card.className = 'story-card';
    card.dataset.storyIdx = idx;

    // Collect URLs for this story
    const storyUrls = new Set();
    (story.sources || []).forEach(s => storyUrls.add(s.url));
    (story.key_facts || []).forEach(f => { if (f.source_url) storyUrls.add(f.source_url); });
    card.dataset.urls = JSON.stringify([...storyUrls]);

    const categories = (story.category || []).map(c =>
      '<span class="category-tag">' + escHtml(c) + '</span>'
    ).join('');

    const facts = (story.key_facts || []).map(f =>
      '<li>' + escHtml(f.fact) + '</li>'
    ).join('');

    const sources = (story.sources || []).map(s =>
      '<li><a href="' + escHtml(s.url) + '" target="_blank">' + escHtml(s.title || s.url) + '</a> <span class="source-outlet">' + escHtml(s.outlet || '') + '</span></li>'
    ).join('');

    card.innerHTML =
      '<div class="story-card-head">' +
        '<h3>' + escHtml(story.headline) + '</h3>' +
        '<span class="toggle"></span>' +
      '</div>' +
      '<div class="story-card-body">' +
        (categories ? '<div class="story-categories">' + categories + '</div>' : '') +
        (facts ? '<div><strong style="font-size:0.75rem;color:#888">Key facts</strong><ul class="fact-list">' + facts + '</ul></div>' : '') +
        (sources ? '<div style="margin-top:0.5rem"><strong style="font-size:0.75rem;color:#888">Sources</strong><ul class="source-list">' + sources + '</ul></div>' : '') +
      '</div>';

    // Toggle expand
    card.querySelector('.story-card-head').addEventListener('click', (e) => {
      e.stopPropagation();
      card.classList.toggle('open');
    });

    // Click card → highlight article paragraphs
    card.addEventListener('click', () => {
      highlightArticleByStory(idx);
    });

    container.appendChild(card);
  });
}

// --- Article rendering ---
function renderArticle() {
  // Strip YAML frontmatter
  let md = DATA_ARTICLE;
  const fmMatch = md.match(/^---\n[\s\S]*?\n---\n/);
  if (fmMatch) md = md.slice(fmMatch[0].length);

  // Fallback if marked.js didn't load from CDN
  const html = (typeof marked !== 'undefined')
    ? marked.parse(md)
    : '<pre style="white-space:pre-wrap;font-family:inherit">' + escHtml(md) + '</pre>';
  document.getElementById('article-content').innerHTML = html;

  // Annotate audited links
  document.querySelectorAll('.article-content a').forEach(a => {
    const href = a.getAttribute('href');
    if (urlToAudit[href]) {
      const issue = urlToAudit[href];
      const firstFlag = issue.flags[0];
      a.classList.add('audit-' + firstFlag.type);
      a.dataset.auditUrl = href;
    }

    // Make article links clickable → scroll to research card
    a.addEventListener('click', (e) => {
      if (urlToStoryIdx[href] !== undefined) {
        e.preventDefault();
        scrollToStoryCard(urlToStoryIdx[href]);
      }
    });
  });
}

// --- Audit tooltip ---
const tooltip = document.getElementById('audit-tooltip');
let tooltipTarget = null;
let tooltipHovered = false;

function showTooltip(link) {
  const url = link.dataset.auditUrl;
  const issue = urlToAudit[url];
  if (!issue) return;

  const isReviewed = reviewedUrls.has(url);

  const flagsHtml = issue.flags.map(f =>
    '<div><span class="flag-type ' + f.type + '">' + f.type.replace('_', ' ') + '</span></div>' +
    '<p style="margin:0.3rem 0 0.5rem">' + escHtml(f.detail) + '</p>'
  ).join('');

  const btnLabel = isReviewed ? 'Undo review' : 'Mark reviewed';

  tooltip.innerHTML =
    '<div style="margin-bottom:0.3rem;font-size:0.7rem;color:#888;word-break:break-all">' + escHtml(issue.url) + '</div>' +
    flagsHtml +
    '<button class="review-btn" data-review-url="' + escHtml(url) + '">' + btnLabel + '</button>';

  const rect = link.getBoundingClientRect();
  tooltip.style.left = Math.min(rect.left, window.innerWidth - 420) + 'px';
  tooltip.style.top = (rect.bottom + 8) + 'px';
  tooltip.classList.add('visible');
  tooltipTarget = link;
}

function hideTooltip() {
  // Small delay so mouse can travel from link to tooltip
  setTimeout(() => {
    if (!tooltipHovered) {
      tooltip.classList.remove('visible');
      tooltipTarget = null;
    }
  }, 100);
}

document.addEventListener('mouseover', (e) => {
  const link = e.target.closest('a[data-audit-url]');
  if (link) {
    showTooltip(link);
    return;
  }
  if (e.target.closest('.audit-tooltip')) {
    tooltipHovered = true;
  }
});

document.addEventListener('mouseout', (e) => {
  if (e.target.closest('.audit-tooltip')) {
    tooltipHovered = false;
    hideTooltip();
    return;
  }
  const link = e.target.closest('a[data-audit-url]');
  if (link && link === tooltipTarget) {
    tooltipHovered = false;
    hideTooltip();
  }
});

// Review button click inside tooltip
tooltip.addEventListener('click', (e) => {
  const btn = e.target.closest('.review-btn');
  if (!btn) return;
  e.stopPropagation();
  const url = btn.dataset.reviewUrl;
  toggleReviewed(url);
  // Re-render tooltip to update button label
  if (tooltipTarget) showTooltip(tooltipTarget);
});

// --- Cross-linking: story → article paragraphs ---
function highlightArticleByStory(storyIdx) {
  // Clear previous highlights
  document.querySelectorAll('.article-content p.highlight-para').forEach(p => {
    p.classList.remove('highlight-para');
  });
  document.querySelectorAll('.story-card.highlighted').forEach(c => {
    c.classList.remove('highlighted');
  });

  // Highlight clicked card
  const card = document.querySelector('.story-card[data-story-idx="' + storyIdx + '"]');
  if (card) card.classList.add('highlighted');

  // Find story URLs
  const story = DATA_RESEARCH.stories[storyIdx];
  const storyUrls = new Set();
  (story.sources || []).forEach(s => storyUrls.add(s.url));
  (story.key_facts || []).forEach(f => { if (f.source_url) storyUrls.add(f.source_url); });

  // Find paragraphs containing links to those URLs
  let firstMatch = null;
  document.querySelectorAll('.article-content p').forEach(p => {
    const links = p.querySelectorAll('a');
    for (const a of links) {
      if (storyUrls.has(a.getAttribute('href'))) {
        p.classList.add('highlight-para');
        if (!firstMatch) firstMatch = p;
        break;
      }
    }
  });

  // Scroll article to first match
  if (firstMatch) {
    // On mobile, switch to article tab
    activateTab('article');
    firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// --- Cross-linking: article link → research card ---
function scrollToStoryCard(storyIdx) {
  // On mobile, switch to research tab
  activateTab('research');

  const card = document.querySelector('.story-card[data-story-idx="' + storyIdx + '"]');
  if (!card) return;

  // Clear previous highlights
  document.querySelectorAll('.story-card.highlighted').forEach(c => c.classList.remove('highlighted'));
  card.classList.add('highlighted');
  card.classList.add('open');
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// --- Right column tabs ---
document.querySelectorAll('.right-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.right-tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.right-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
  });
});

// --- Audit findings list ---
function renderAuditList() {
  const container = document.getElementById('audit-list');
  if (!DATA_AUDIT || !DATA_AUDIT.issues || DATA_AUDIT.issues.length === 0) {
    container.innerHTML = '<div class="audit-empty">No audit findings</div>';
    return;
  }

  DATA_AUDIT.issues.forEach(issue => {
    const item = document.createElement('div');
    item.className = 'audit-item' + (reviewedUrls.has(issue.url) ? ' reviewed' : '');
    item.dataset.url = issue.url;

    const flagBadges = issue.flags.map(f =>
      '<span class="flag-type ' + f.type + '">' + f.type.replace('_', ' ') + '</span>'
    ).join(' ');

    item.innerHTML =
      '<div class="audit-item-head">' +
        '<span class="anchor-text">' + escHtml(issue.anchor_text) + '</span>' +
        '<span class="review-toggle">&#10003;</span>' +
      '</div>' +
      '<div style="margin-top:0.3rem">' + flagBadges + '</div>' +
      '<div class="claim-text">' + escHtml(issue.claim) + '</div>' +
      '<div class="detail-text">' + issue.flags.map(f => escHtml(f.detail)).join(' ') + '</div>';

    // Click anchor text → scroll to link in article
    item.querySelector('.anchor-text').addEventListener('click', (e) => {
      e.stopPropagation();
      const articleLink = document.querySelector('.article-content a[data-audit-url="' + CSS.escape(issue.url) + '"]');
      if (articleLink) {
        activateTab('article');
        // Highlight the parent paragraph
        document.querySelectorAll('.article-content p.highlight-para').forEach(p => p.classList.remove('highlight-para'));
        const para = articleLink.closest('p');
        if (para) para.classList.add('highlight-para');
        articleLink.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    // Click checkbox → toggle reviewed
    item.querySelector('.review-toggle').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleReviewed(issue.url);
    });

    container.appendChild(item);
  });
}

// --- Rewrite column ---
function renderRewrite() {
  const container = document.getElementById('rewrite-content');
  if (!DATA_REWRITE) {
    container.innerHTML = '<div class="rewrite-empty">No rewrite yet</div>';
    return;
  }

  // Strip frontmatter from both
  function stripFm(text) {
    const m = text.match(/^---\n[\s\S]*?\n---\n/);
    return m ? text.slice(m[0].length).trim() : text.trim();
  }

  const original = stripFm(DATA_ARTICLE);
  const rewritten = stripFm(DATA_REWRITE);

  if (typeof Diff === 'undefined') {
    container.innerHTML = '<div class="rewrite-empty">Diff library not loaded</div>';
    return;
  }
  const diff = Diff.diffWords(original, rewritten);
  let html = '<div class="diff-content" style="font-size:0.9rem">';
  diff.forEach(part => {
    if (part.added) {
      html += '<ins>' + escHtml(part.value) + '</ins>';
    } else if (part.removed) {
      html += '<del>' + escHtml(part.value) + '</del>';
    } else {
      html += escHtml(part.value);
    }
  });
  html += '</div>';
  container.innerHTML = html;
}

// --- Mobile tabs ---
function activateTab(name) {
  // Only on mobile
  if (window.innerWidth > 900) return;
  document.querySelectorAll('.tab-bar button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.col === name);
  });
  document.querySelectorAll('.col').forEach(col => {
    col.classList.toggle('active', col.id === 'col-' + name);
  });
}

document.querySelectorAll('.tab-bar button').forEach(btn => {
  btn.addEventListener('click', () => activateTab(btn.dataset.col));
});

// --- Util ---
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- Init (each step isolated so one failure doesn't kill the rest) ---
[renderResearchCards, renderArticle, renderAuditList, applyReviewedState, renderRewrite].forEach(fn => {
  try { fn(); } catch(e) { console.error(fn.name + ':', e); }
});
</script>
