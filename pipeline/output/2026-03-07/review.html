    '<p style="margin:0.3rem 0 0.5rem">' + escHtml(f.detail) + '</p>'
  ).join('');

  const btnLabel = isReviewed ? 'Undo review' : 'Mark reviewed';

  tooltip.innerHTML =
    '<div style="margin-bottom:0.3rem;font-size:0.7rem;color:#888;word-break:break-all">' + escHtml(issue.url) + '</div>' +
    flagsHtml +
    '<button class="review-btn" data-review-url="' + escHtml(url) + '">' + btnLabel + '</button>';

  const rect = link.getBoundingClientRect();
  tooltip.style.left = Math.min(rect.left, window.innerWidth - 420) + 'px';
  tooltip.style.top = (rect.bottom + 8) + 'px';
  tooltip.classList.add('visible');
  tooltipTarget = link;
}

function hideTooltip() {
  // Small delay so mouse can travel from link to tooltip
  setTimeout(() => {
    if (!tooltipHovered) {
      tooltip.classList.remove('visible');
      tooltipTarget = null;
    }
  }, 100);
}

document.addEventListener('mouseover', (e) => {
  const link = e.target.closest('a[data-audit-url]');
  if (link) {
    showTooltip(link);
    return;
  }
  if (e.target.closest('.audit-tooltip')) {
    tooltipHovered = true;
  }
});

document.addEventListener('mouseout', (e) => {
  if (e.target.closest('.audit-tooltip')) {
    tooltipHovered = false;
    hideTooltip();
    return;
  }
  const link = e.target.closest('a[data-audit-url]');
  if (link && link === tooltipTarget) {
    tooltipHovered = false;
    hideTooltip();
  }
});

// Review button click inside tooltip
tooltip.addEventListener('click', (e) => {
  const btn = e.target.closest('.review-btn');
  if (!btn) return;
  e.stopPropagation();
  const url = btn.dataset.reviewUrl;
  toggleReviewed(url);
  // Re-render tooltip to update button label
  if (tooltipTarget) showTooltip(tooltipTarget);
});

// --- Cross-linking: story → article paragraphs ---
function highlightArticleByStory(storyIdx) {
  // Clear previous highlights
  document.querySelectorAll('.article-content p.highlight-para').forEach(p => {
    p.classList.remove('highlight-para');
  });
  document.querySelectorAll('.story-card.highlighted').forEach(c => {
    c.classList.remove('highlighted');
  });

  // Highlight clicked card
  const card = document.querySelector('.story-card[data-story-idx="' + storyIdx + '"]');
  if (card) card.classList.add('highlighted');

  // Find story URLs
  const story = DATA_RESEARCH.stories[storyIdx];
  const storyUrls = new Set();
  (story.sources || []).forEach(s => storyUrls.add(s.url));
  (story.key_facts || []).forEach(f => { if (f.source_url) storyUrls.add(f.source_url); });

  // Find paragraphs containing links to those URLs
  let firstMatch = null;
  document.querySelectorAll('.article-content p').forEach(p => {
    const links = p.querySelectorAll('a');
    for (const a of links) {
      if (storyUrls.has(a.getAttribute('href'))) {
        p.classList.add('highlight-para');
        if (!firstMatch) firstMatch = p;
        break;
      }
    }
  });

  // Scroll article to first match
  if (firstMatch) {
    // On mobile, switch to article tab
    activateTab('article');
    firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// --- Cross-linking: article link → research card ---
function scrollToStoryCard(storyIdx) {
  // On mobile, switch to research tab
  activateTab('research');

  const card = document.querySelector('.story-card[data-story-idx="' + storyIdx + '"]');
  if (!card) return;

  // Clear previous highlights
  document.querySelectorAll('.story-card.highlighted').forEach(c => c.classList.remove('highlighted'));
  card.classList.add('highlighted');
  card.classList.add('open');
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// --- Right column tabs ---
document.querySelectorAll('.right-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.right-tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.right-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
  });
});

// --- Audit findings list ---
function renderAuditList() {
  const container = document.getElementById('audit-list');
  if (!DATA_AUDIT || !DATA_AUDIT.issues || DATA_AUDIT.issues.length === 0) {
    container.innerHTML = '<div class="audit-empty">No audit findings</div>';
    return;
  }

  DATA_AUDIT.issues.forEach(issue => {
    const item = document.createElement('div');
    item.className = 'audit-item' + (reviewedUrls.has(issue.url) ? ' reviewed' : '');
    item.dataset.url = issue.url;

    const flagBadges = issue.flags.map(f =>
      '<span class="flag-type ' + f.type + '">' + f.type.replace('_', ' ') + '</span>'
    ).join(' ');

    item.innerHTML =
      '<div class="audit-item-head">' +
        '<span class="anchor-text">' + escHtml(issue.anchor_text) + '</span>' +
        '<span class="review-toggle">&#10003;</span>' +
      '</div>' +
      '<div style="margin-top:0.3rem">' + flagBadges + '</div>' +
      '<div class="claim-text">' + escHtml(issue.claim) + '</div>' +
      '<div class="detail-text">' + issue.flags.map(f => escHtml(f.detail)).join(' ') + '</div>';

    // Click anchor text → scroll to link in article
    item.querySelector('.anchor-text').addEventListener('click', (e) => {
      e.stopPropagation();
      const articleLink = document.querySelector('.article-content a[data-audit-url="' + CSS.escape(issue.url) + '"]');
      if (articleLink) {
        activateTab('article');
        // Highlight the parent paragraph
        document.querySelectorAll('.article-content p.highlight-para').forEach(p => p.classList.remove('highlight-para'));
        const para = articleLink.closest('p');
        if (para) para.classList.add('highlight-para');
        articleLink.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    // Click checkbox → toggle reviewed
    item.querySelector('.review-toggle').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleReviewed(issue.url);
    });

    container.appendChild(item);
  });
}

// --- Rewrite column ---
function renderRewrite() {
  const container = document.getElementById('rewrite-content');
  if (!DATA_REWRITE) {
    container.innerHTML = '<div class="rewrite-empty">No rewrite yet</div>';
    return;
  }

  // Strip frontmatter from both
  function stripFm(text) {
    const m = text.match(/^---\n[\s\S]*?\n---\n/);
    return m ? text.slice(m[0].length).trim() : text.trim();
  }

  const original = stripFm(DATA_ARTICLE);
  const rewritten = stripFm(DATA_REWRITE);

  if (typeof Diff === 'undefined') {
    container.innerHTML = '<div class="rewrite-empty">Diff library not loaded</div>';
    return;
  }
  const diff = Diff.diffWords(original, rewritten);
  let html = '<div class="diff-content" style="font-size:0.9rem">';
  diff.forEach(part => {
    if (part.added) {
      html += '<ins>' + escHtml(part.value) + '</ins>';
    } else if (part.removed) {
      html += '<del>' + escHtml(part.value) + '</del>';
    } else {
      html += escHtml(part.value);
    }
  });
  html += '</div>';
  container.innerHTML = html;
}

// --- Mobile tabs ---
function activateTab(name) {
  // Only on mobile
  if (window.innerWidth > 900) return;
  document.querySelectorAll('.tab-bar button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.col === name);
  });
  document.querySelectorAll('.col').forEach(col => {
    col.classList.toggle('active', col.id === 'col-' + name);
  });
}

document.querySelectorAll('.tab-bar button').forEach(btn => {
  btn.addEventListener('click', () => activateTab(btn.dataset.col));
});

// --- Util ---
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- Init (each step isolated so one failure doesn't kill the rest) ---
[renderResearchCards, renderArticle, renderAuditList, applyReviewedState, renderRewrite].forEach(fn => {
  try { fn(); } catch(e) { console.error(fn.name + ':', e); }
});
</script>
