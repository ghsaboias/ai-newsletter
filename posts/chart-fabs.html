<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mega-Fábricas de Chips nos EUA</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif;
    background: #FFFFFF;
    color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 38px;
  }
  .card {
    width: 720px;
    background: #FFFFFF;
    padding: 36px 40px;
  }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 24px;
    border-bottom: 3px solid #044B2E;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #000000;
    letter-spacing: -0.8px;
    line-height: 24px;
  }
  .logo { height: 18px; vertical-align: baseline; }
  .chart-area {
    padding: 28px 0 24px;
  }
  .chart-container {
    width: 100%;
    height: 320px;
  }
  .subtitle {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #044B2E;
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px solid #E5E5E5;
  }
  .subtitle .meta {
    color: #999;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    margin-left: 6px;
  }
  .legend {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    font-size: 11px;
    color: #444;
  }
  .legend > span {
    display: inline-flex;
    align-items: center;
  }
  .legend .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-right: 6px;
    border-radius: 2px;
  }
  .footer {
    padding-top: 16px;
    border-top: 1px solid #E5E5E5;
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
  }
  .footer span {
    font-size: 10px;
    color: #999;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="card" id="capture">
  <div class="header">
    <h1>Mega-Fábricas de Chips nos EUA: SpaceX Entra na Lista</h1>
    <img src="../../daily-journal-platform/public/images/logo/logo-green-horizontal.png" class="logo" alt="Daily Journal">
  </div>

  <div class="chart-area">
    <div class="chart-container">
      <canvas id="fabs"></canvas>
    </div>

    <div class="subtitle">Notas <span class="meta">· valores totais anunciados, não desembolsados</span></div>
    <div class="legend">
      <span><span class="swatch" style="background:#7DB89B"></span>SpaceX (anúncio desta semana)</span>
      <span><span class="swatch" style="background:#044B2E"></span>Anúncios anteriores</span>
    </div>
  </div>

  <div class="footer">
    <span>Fonte: TSMC, Intel, Micron, Samsung, Grimes County (TX) · buildouts em 10–20 anos</span>
    <span>dailyjournal.news</span>
  </div>
</div>

<script>
  const fabs = {
    labels: ['TSMC — Arizona', 'Intel — Ohio', 'Micron — Nova York', 'SpaceX — Texas (Terafab)', 'Micron — Idaho', 'Samsung — Texas'],
    values: [165, 100, 100, 55, 50, 40],
    highlight: [false, false, false, true, false, false],
    notes: ['6 fabs + R&D', 'até 2030+', '4 fabs DRAM', 'fases iniciais; até US$119bi', 'Boise', 'Taylor + Austin']
  };

  const colors = fabs.highlight.map(h => h ? '#7DB89B' : '#044B2E');

  new Chart(document.getElementById('fabs').getContext('2d'), {
    type: 'bar',
    data: {
      labels: fabs.labels,
      datasets: [{
        data: fabs.values,
        backgroundColor: colors,
        borderWidth: 0,
        borderRadius: 2,
        borderSkipped: false,
        barPercentage: 0.82,
        categoryPercentage: 0.78,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: {
          beginAtZero: true,
          max: 200,
          grid: { color: '#f0f0f0', drawTicks: false },
          border: { display: false },
          ticks: {
            font: { family: 'Helvetica Neue', size: 11 },
            color: '#999',
            padding: 8,
            stepSize: 50,
            callback: function(v) { return '$' + v + 'bi'; }
          }
        },
        y: {
          grid: { display: false },
          border: { display: false },
          ticks: {
            font: { family: 'Helvetica Neue', size: 12, weight: '600' },
            color: '#000',
            padding: 8
          }
        }
      },
      layout: { padding: { top: 8, right: 80, left: 0, bottom: 8 } }
    },
    plugins: [{
      id: 'valueLabels',
      afterDraw(chart) {
        const { ctx } = chart;
        const meta = chart.getDatasetMeta(0).data;
        fabs.labels.forEach((lbl, i) => {
          const bar = meta[i];
          const v = fabs.values[i];
          const note = fabs.notes[i];
          ctx.save();
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.font = '700 12px Helvetica Neue';
          ctx.fillStyle = '#044B2E';
          ctx.fillText('US$' + v + 'bi', bar.x + 8, bar.y);
          ctx.font = '500 10px Helvetica Neue';
          ctx.fillStyle = '#999';
          ctx.fillText(note, bar.x + 8, bar.y + 13);
          ctx.restore();
        });
      }
    }]
  });
</script>
</body>
</html>
